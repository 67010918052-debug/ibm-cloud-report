d:'การให้บริการฐานข้อมูลบนคลาวด์ที่ผู้ให้บริการดูแลระบบฐานข้อมูลและโครงสร้างพื้นฐานตามขอบเขต ผู้ใช้สร้างฐานข้อมูลและเชื่อมต่อจากแอป ลดภาระติดตั้งและบำรุงรักษาเอง มีทั้งฐานข้อมูลเชิงสัมพันธ์และ NoSQL เลือกตามลักษณะข้อมูลและวิธีค้นหา',
p:[['Databases for PostgreSQL','PostgreSQL แบบจัดการให้ ฐานข้อมูลเชิงสัมพันธ์โอเพนซอร์ส ใช้ SQL เหมาะกับข้อมูลสมาชิก สินค้า คำสั่งซื้อ'],['Databases for MySQL','MySQL แบบจัดการให้ เหมาะกับแอปที่พัฒนาด้วย MySQL แทนการติดตั้งและดูแลเอง'],['Databases for MongoDB','ฐานข้อมูลแบบเอกสาร รองรับการค้นหาและ Aggregation เหมาะกับข้อมูลหลายรูปแบบ เช่น รายละเอียดสินค้าที่ต่างกันตามประเภท'],['IBM Cloudant','NoSQL เก็บเอกสาร JSON เข้าถึงผ่าน HTTPS API ยืดหยุ่นด้านโครงสร้าง มี SDK สำหรับ Node.js, Java, Python, Go'],['Databases for Redis','จัดเก็บข้อมูลในหน่วยความจำ เข้าถึงเร็ว ใช้เป็น Cache ลดการอ่านซ้ำจากฐานข้อมูลหลัก']],
k:[['สร้างและเชื่อมต่อฐานข้อมูล','นำข้อมูลการเชื่อมต่อไปตั้งค่าในแอป ผ่านไดรเวอร์/เครื่องมือของฐานข้อมูลหรือ HTTPS API (Cloudant)'],['สำรองข้อมูลและกู้คืน','ผ่านส่วน Backups and Restore และสร้างข้อมูลสำรองก่อนเปลี่ยนแปลงสำคัญ'],['รองรับความพร้อมใช้งานสูง','High Availability แต่สถาปัตยกรรมต่างกันตามประเภทฐานข้อมูล'],['ปรับทรัพยากร','ปรับขนาดผ่านคำสั่งของบริการ ไม่ใช่ทุกประเภทปรับอัตโนมัติเหมือนกัน'],['ความปลอดภัยและแบ่งความรับผิดชอบ','บริการดูแลการเข้ารหัสข้อมูลที่จัดเก็บ ระหว่างรับส่ง และข้อมูลสำรอง ผู้ใช้ดูแลรหัสผ่านและข้อมูลรับรอง']],
b:'ลดภาระติดตั้งและบำรุงรักษาฐานข้อมูล เลือกประเภทให้เหมาะกับงาน ปรับทรัพยากรผ่านตัวเลือกของบริการ และมีสำรอง/กู้คืน/HA สนับสนุนการให้บริการ'},
{id:'sec',ic:'🔐',n:'Security & Identity',f:'การรักษาความปลอดภัยและจัดการตัวตน',c:'Security',
d:'กลุ่มบริการที่ช่วยรักษาความปลอดภัยของข้อมูล แอป และทรัพยากรบนคลาวด์ รวมถึงจัดการตัวตนและสิทธิ์ ครอบคลุมการกำหนดสิทธิ์ ปกป้องข้อมูลสำคัญ จัดการกุญแจเข้ารหัส และป้องกันภัยคุกคามต่อเว็บไซต์ ต้องอาศัยการตั้งค่าขององค์กร เช่น ให้สิทธิ์เท่าที่จำเป็น เก็บข้อมูลรับรองอย่างปลอดภัย และตรวจสอบกิจกรรมต่อเนื่อง',
p:[['IBM Cloud IAM','จัดการตัวตนและสิทธิ์ กำหนด Access Policy ให้ผู้ใช้และแอป จัดผู้ใช้เป็น Access Group'],['IBM Key Protect','จัดการกุญแจเข้ารหัส สร้าง/นำเข้ากุญแจ ตรวจสถานะ หมุนเวียนกุญแจ เช่น เข้ารหัสข้อมูลใน Cloud Object Storage'],['IBM Cloud Secrets Manager','จัดเก็บข้อมูลลับ เช่น รหัสผ่าน API Key แยกจาก Source Code กำหนดสิทธิ์ผ่าน IAM'],['IBM Cloud Internet Services (CIS)','ปกป้องและเพิ่มประสิทธิภาพเว็บไซต์/API: ป้องกัน DDoS, WAF, Rate Limiting'],['Activity Tracker Event Routing','ส่ง Audit Events จากบริการไปยังปลายทางที่เลือก เช่น IBM Cloud Logs เพื่อตรวจสอบย้อนหลัง']],
k:[['กำหนดสิทธิ์ตามหน้าที่ (Least Privilege)','ผู้ตรวจสอบข้อมูลไม่จำเป็นต้องมีสิทธิ์ลบทรัพยากร เมื่อเปลี่ยนหน้าที่ปรับสมาชิก Access Group หรือนโยบาย'],['แยกตัวตนแอปออกจากผู้ใช้','ใช้ Service ID ให้แอปมีสิทธิ์เฉพาะ ไม่ต้องใช้ข้อมูลรับรองของพนักงาน'],['ปกป้องกุญแจและข้อมูลลับ','Key Protect เน้นกุญแจเข้ารหัสข้อมูล, Secrets Manager เน้นข้อมูลลับที่ใช้เข้าถึงระบบ'],['ป้องกันและตรวจสอบภัยคุกคาม','CIS กรองคำขอ และส่ง Audit Events เพื่อวิเคราะห์เมื่อพบความผิดปกติ']],
b:'กำหนดสิทธิ์เข้าถึงอย่างเป็นระบบ ลดการเปิดเผยข้อมูลรับรองโดยไม่จำเป็น จัดการกุญแจด้วยบริการเฉพาะ และสนับสนุนการดูแลระบบต่อเนื่อง'},
{id:'iot',ic:'📡',n:'IoT',f:'Internet of Things',c:'Network',
d:'การเชื่อมต่ออุปกรณ์ เครื่องจักร และเซนเซอร์ผ่านเครือข่ายเพื่อรับส่งและใช้ประโยชน์ข้อมูล เช่น วัดอุณหภูมิ ติดตามพลังงาน เฝ้าระวังเครื่องจักร คลาวด์เป็นส่วนกลางรับ จัดเก็บ ประมวลผล และแสดงผล IBM Cloud อธิบายในฐานะโครงสร้างพื้นฐานและบริการที่ประกอบเป็นระบบ IoT องค์กรต้องออกแบบส่วนเชื่อมอุปกรณ์ การรับส่งข้อความ ประมวลผล และจัดเก็บเอง',
p:[['IBM Watson IoT Platform (ยุติแล้ว)','เคยเชื่อมต่ออุปกรณ์และรับข้อมูลจากเซนเซอร์ ยุติบริการแล้วเมื่อ 1 ธ.ค. ค.ศ. 2023'],['IBM Event Streams','บริการรับส่งข้อมูลเหตุการณ์บน Apache Kafka กระจายข้อมูลระหว่างบริการกับแอป'],['IBM Cloud Kubernetes Service','รันองค์ประกอบ IoT แบบคอนเทนเนอร์ เช่น แอปรับข้อมูล และ MQTT Broker (องค์กรติดตั้งและดูแลเอง)'],['IBM Cloud Code Engine','รันแอปหรือ Job ประมวลผลข้อมูล เช่น ตรวจสอบข้อมูลผ่าน HTTP API หรือสรุปรายวัน'],['Cloud Object Storage + ฐานข้อมูล','Object Storage เก็บข้อมูลดิบ/ย้อนหลัง ฐานข้อมูลเก็บข้อมูลที่ต้องค้นหาและแสดงผล']],
k:[['รับข้อมูลจากอุปกรณ์และ Gateway','เซนเซอร์ส่งข้อมูลผ่านเครือข่าย Gateway อาจรวบรวมและแปลงข้อมูลก่อนส่งขึ้นคลาวด์'],['ตรวจสอบตัวตนและสิทธิ์อุปกรณ์','ต้องออกแบบแยกจากสิทธิ์ของบริการคลาวด์ เช่น IAM'],['ส่งต่อและประมวลผล','ส่งผ่าน Event Streams ไปส่วนแสดงผล ตรวจเงื่อนไข และจัดเก็บ'],['จัดเก็บเพื่อวิเคราะห์ย้อนหลัง','ควรมีรหัสอุปกรณ์ เวลา และหน่วยวัด เพื่อตีความข้อมูลได้ถูกต้อง']],
b:'รวบรวมข้อมูลจากหลายอุปกรณ์เข้าระบบกลาง ติดตามการทำงาน ตรวจความผิดปกติ วิเคราะห์ย้อนหลัง และวางแผนทรัพยากรตามขนาดระบบ'},
{id:'sta',ic:'💾',n:'STaaS',f:'Storage as a Service',c:'Data',
d:'การให้บริการพื้นที่จัดเก็บข้อมูลผ่านคลาวด์ สำหรับข้อมูลแอป เอกสาร รูปภาพ ข้อมูลสำรอง และข้อมูลย้อนหลัง IBM Cloud มี 3 รูปแบบ: Object, Block และ File เลือกตามว่าแอปเข้าถึงข้อมูลเป็นวัตถุ ดิสก์ หรือไฟล์ที่ใช้ร่วมกัน',
p:[['IBM Cloud Object Storage','เก็บข้อมูลเป็น Object ใน Bucket เข้าถึงผ่าน API เหมาะกับรูปภาพ วิดีโอ เอกสาร ไฟล์วิเคราะห์ มี Storage Class ตามความถี่เข้าถึง'],['Block Storage for VPC','เหมือนดิสก์ต่อกับเครื่องเสมือนใน VPC ใช้เป็น Boot Volume (ระบบปฏิบัติการ) หรือ Data Volume'],['File Storage for VPC','จัดเก็บแบบไฟล์ผ่าน NFS สร้าง File Share ให้หลายเครื่องใช้ไฟล์ร่วมกัน ลดการทำสำเนาไฟล์แยกในแต่ละเครื่อง']],
k:[['เลือกรูปแบบให้เหมาะกับงาน','Object ผ่าน API, Block เป็นพื้นที่ของเครื่อง, File ใช้ร่วมกันหลายเครื่อง ใช้ร่วมกันในระบบเดียวได้'],['เพิ่มความจุและกำหนดประสิทธิภาพ','Block/File for VPC เริ่มเล็กแล้วขยายได้ File Storage ปรับขีดจำกัดประสิทธิภาพได้'],['Storage Class ตามความถี่เข้าถึง','มีตัวเลือกข้อมูลใช้บ่อย/น้อย Smart Tier จัดระดับค่าใช้จ่ายตามการใช้รายเดือน และ Archive สำหรับเก็บระยะยาว (คำนึงถึงเวลาดึงกลับ)'],['เวอร์ชันและ Lifecycle','เก็บหลายเวอร์ชันของ Object และกฎลบ/ย้าย Archive ตามเงื่อนไข ระวังพื้นที่ที่เพิ่มและข้อมูลที่ต้องเก็บ'],['สำรองและความปลอดภัย','VPC มี Snapshot/Backup, Object Storage เชื่อม Key Protect เพื่อเข้ารหัส Bucket']],
b:'ลดภาระจัดซื้อและดูแลอุปกรณ์จัดเก็บ เลือกประเภทตามลักษณะงาน วางแผนความจุ ประสิทธิภาพ และใช้เวอร์ชัน การสำรอง การเข้ารหัสดูแลข้อมูล'},
{id:'bigdata',ic:'📊',n:'Big Data & Analytics',f:'ข้อมูลขนาดใหญ่และการวิเคราะห์',c:'Data',
d:'กลุ่มบริการและเครื่องมือสำหรับจัดเก็บ จัดเตรียม ประมวลผล และวิเคราะห์ข้อมูลจำนวนมากหรือจากหลายแหล่ง เพื่อเปลี่ยนเป็นสารสนเทศประกอบการตัดสินใจ เช่น วิเคราะห์ยอดขาย พฤติกรรมลูกค้า ประสิทธิภาพการดำเนินงาน',
p:[['IBM watsonx.data','แพลตฟอร์ม Data Lakehouse รวมความยืดหยุ่นของ Data Lake (หลายรูปแบบข้อมูล) กับการจัดการ/วิเคราะห์แบบ Data Warehouse รองรับงานวิเคราะห์และ AI'],['IBM Analytics Engine','Standard Serverless สำหรับ Apache Spark ประมวลผลโดยไม่ต้องดูแลคลัสเตอร์ Spark เอง ส่งแอป Spark ผ่าน API'],['IBM Db2 Warehouse','คลังข้อมูลสำหรับงานวิเคราะห์ (SaaS บน IBM Cloud) สร้างรายงานและสนับสนุน Dashboard'],['IBM Cloud Object Storage','จัดเก็บไฟล์ข้อมูลดิบ ข้อมูลย้อนหลัง และผลลัพธ์ ต้องใช้ร่วมกับเครื่องมือวิเคราะห์']],
k:[['รวบรวมข้อมูลจากหลายแหล่ง','ฐานข้อมูลระบบงาน ไฟล์เอกสาร พื้นที่จัดเก็บบนคลาวด์'],['จัดเตรียมและประมวลผล','ตรวจคุณภาพ เช่น ค่าสูญหาย ข้อมูลซ้ำ รูปแบบวันที่ไม่ตรงกัน แล้วแปลงด้วย Spark'],['วิเคราะห์ด้วยเครื่องมือที่เหมาะ','ใช้ SQL ในคลังข้อมูลคำนวณยอดขายตามสินค้า สาขา ช่วงเวลา'],['จัดการทรัพยากร','กำหนด Spark Driver/Executor ใน Analytics Engine; Db2 Warehouse แยกส่วนประมวลผลและจัดเก็บ'],['นำผลไปตัดสินใจ','ทำรายงาน/Dashboard เปรียบเทียบยอดขายกับเป้า ค้นหาช่วงความต้องการสูง']],
b:'จัดการข้อมูลหลายแหล่ง เลือกเครื่องมือเหมาะกับงาน ลดภาระโครงสร้างพื้นฐานบางส่วน และสนับสนุนรายงาน วิเคราะห์แนวโน้ม หรือพัฒนางาน AI'},
{id:'bcaas',ic:'⛓️',n:'BCaaS',f:'Blockchain as a Service',c:'Data',
d:'การให้บริการแพลตฟอร์มและองค์ประกอบสำหรับพัฒนาและดำเนินงานเครือข่ายบล็อกเชนบนคลาวด์ ลดภาระจัดเตรียมโครงสร้างพื้นฐานบางส่วน ผู้ใช้ยังต้องออกแบบกติกาเครือข่าย สิทธิ์สมาชิก และตรรกะแอป บล็อกเชนองค์กรช่วยให้หลายหน่วยงานบันทึกธุรกรรมร่วมกัน เช่น การส่งมอบสินค้าระหว่างผู้ผลิต ผู้ขนส่ง ผู้รับ',
p:[['IBM Blockchain Platform (ผลิตภัณฑ์เดิม)','ใช้ Hyperledger Fabric เป็นพื้นฐาน มีเครื่องมือจัดการองค์ประกอบเครือข่าย'],['IBM Support for Hyperledger Fabric','ผลิตภัณฑ์และการสนับสนุน Fabric พร้อมแนวทางติดตั้งบน Kubernetes Cluster และเครื่องมือพัฒนา Smart Contract'],['Hyperledger Fabric','กรอบบล็อกเชนโอเพนซอร์สแบบ Permissioned สมาชิกมีตัวตนและบทบาทกำหนดไว้ เป็นเทคโนโลยีพื้นฐาน ไม่ใช่บริการคลาวด์ของ IBM ในตัวเอง']],
k:[['กำหนดสมาชิกและกติกา','ต้องกำหนดสมาชิกและสิทธิ์ก่อนใช้ เช่น ใครส่ง ตรวจสอบ หรืออ่านข้อมูลได้'],['บันทึกธุรกรรมใน Ledger','ผ่านการตรวจสอบตามกติกาก่อนบันทึก ความน่าเชื่อถือขึ้นกับความถูกต้องของข้อมูลนำเข้า'],['Smart Contract / Chaincode','โค้ดกำหนดเงื่อนไขและการดำเนินการ เช่น เงื่อนไขการเปลี่ยนสถานะสินค้า'],['ควบคุมการแบ่งปันข้อมูล','แบ่งปันเฉพาะข้อมูลที่ต้องการแก่สมาชิกที่เกี่ยวข้อง'],['ดำเนินงานบนโครงสร้างพื้นฐานคลาวด์','ต้องวางแผนทรัพยากร เครือข่าย จัดเก็บ และแยกหน้าที่ผู้ให้บริการกับการดูแลซอฟต์แวร์บล็อกเชน']],
b:'หลายองค์กรใช้ประวัติธุรกรรมร่วมกัน ตรวจสอบที่มาของรายการ และดำเนินงานตามกติกาผ่าน Smart Contract',

function regTbl(a){return tbl(['ภูมิภาค','ประเทศ','เมือง/พื้นที่','รหัส Region','ประเภท'],REG.filter(r=>a=='ทั้งหมด'||r[0]==a).map(r=>[r[0],r[1],r[2],`<code>${r[3]}</code>`,`<span class="tag">${r[4]}</span>`]))}
function render(){
 const h=location.hash.replace(/^#/,'')||'/';const m=h.split('/');
 const key=m[1]||'';

 $('#app').innerHTML=key==''?V.home():key=='service'?V.service(m[2]):(V[key]||V.home)();
 window.scrollTo(0,0);
}

 const r=e.target.closest('[data-r]');if(r){document.querySelectorAll('#rf .chip').forEach(b=>b.classList.toggle('on',b==r));$('#rt').innerHTML=regTbl(r.dataset.r)}
